workflows:
  petcare360-ios:
    name: PetCare360 iOS Simulator Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm

    scripts:
      - name: Show build environment
        script: |
          echo "=== SOURCE REVISION ==="
          git rev-parse HEAD
          echo "=== XCODE VERSION ==="
          xcodebuild -version
          echo "=== AVAILABLE SDKs ==="
          xcodebuild -showsdks
          echo "=== PROJECT TARGETS ==="
          xcodebuild -list -project PetCare360.xcodeproj
          echo "=== APP BUILD SETTINGS ==="
          xcodebuild -showBuildSettings -project PetCare360.xcodeproj -scheme PetCare360 | grep -E '(^| )SDKROOT =|SUPPORTED_PLATFORMS =|IPHONEOS_DEPLOYMENT_TARGET =|PRODUCT_TYPE ='

      - name: Resolve Swift package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project PetCare360.xcodeproj \
            -scheme PetCare360

      - name: Build PetCare360 for iOS Simulator
        script: |
          xcodebuild \
            -project PetCare360.xcodeproj \
            -scheme PetCare360 \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/ios/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
