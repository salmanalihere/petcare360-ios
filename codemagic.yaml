workflows:
  petcare360-ios:
    name: PetCare360 iOS Simulator Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm

    scripts:
      - name: Show build environment
        script: |
          echo "=== SOURCE REVISION ==="
          git rev-parse HEAD
          echo "=== XCODE VERSION ==="
          xcodebuild -version
          echo "=== AVAILABLE SDKs ==="
          xcodebuild -showsdks
          echo "=== PROJECT TARGETS ==="
          xcodebuild -list -project PetCare360.xcodeproj
          echo "=== APP BUILD SETTINGS ==="
          xcodebuild -showBuildSettings -project PetCare360.xcodeproj -scheme PetCare360 | grep -E '(^| )SDKROOT =|SUPPORTED_PLATFORMS =|IPHONEOS_DEPLOYMENT_TARGET =|PRODUCT_BUNDLE_IDENTIFIER =|MARKETING_VERSION =|CURRENT_PROJECT_VERSION ='

      - name: Resolve Swift package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project PetCare360.xcodeproj \
            -scheme PetCare360

      - name: Build PetCare360 for iOS Simulator
        script: |
          xcodebuild \
            -project PetCare360.xcodeproj \
            -scheme PetCare360 \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/ios/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  petcare360-testflight:
    name: PetCare360 TestFlight IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Xenon

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.xenon-media.petcare360

    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm

    scripts:
      - name: Show build configuration
        script: |
          echo "=== SOURCE REVISION ==="
          git rev-parse HEAD
          echo "=== XCODE VERSION ==="
          xcodebuild -version
          echo "=== PROJECT TARGETS ==="
          xcodebuild -list -project PetCare360.xcodeproj
          echo "=== VERSION SETTINGS ==="
          xcodebuild -showBuildSettings -project PetCare360.xcodeproj -scheme PetCare360 | grep -E 'PRODUCT_BUNDLE_IDENTIFIER =|MARKETING_VERSION =|CURRENT_PROJECT_VERSION ='

      - name: Resolve Swift package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project PetCare360.xcodeproj \
            -scheme PetCare360

      # Icon step REMOVED on the personalization branch (2026-11-07):
      # scripts/generate_app_icon.sh re-rendered AppIcon-1024.png
      # from the old AppIcon.svg, overwriting the owner's original
      # artwork. The TestFlight build now uses the AppIcon-1024.png
      # committed in the repository as-is. All alternate pet icons
      # are unaffected (the script never touched them).

      - name: Apply App Store signing profiles
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project PetCare360.xcodeproj \
            --scheme PetCare360 \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  petcare360-storage-diagnostics:
    name: PetCare 360 · Storage Diagnostics
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "PetCare360.xcodeproj"
        XCODE_SCHEME: "PetCare360"
        DIAG_DIR: "build/diagnostics"
        DERIVED_DATA: "build/DerivedData"
    scripts:
      - name: Toolchain + simulator inventory
        script: |
          mkdir -p "$DIAG_DIR"
          {
            xcodebuild -version
            echo
            xcrun simctl list devices available
          } 2>&1 | tee "$DIAG_DIR/00-toolchain.log"
      - name: Select an available iPhone simulator
        script: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          candidates = [dev for runtime, devs in data['devices'].items()
                        if 'iOS' in runtime
                        for dev in devs
                        if dev.get('isAvailable') and 'iPhone' in dev.get('name', '')]
          print(candidates[0]['udid'] if candidates else '')")
          if [ -z "$UDID" ]; then
            echo 'ERROR: no available iPhone simulator on this image' | tee "$DIAG_DIR/00-toolchain.log"
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> "$CM_ENV"
          echo "Selected simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
      - name: Build for testing (simulator, no signing, testability ON)
        script: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            2>&1 | tee "$DIAG_DIR/01-build-for-testing.log"
      - name: Record built simulator products
        script: |
          echo "=== DERIVED DATA PRODUCTS ==="
          find "$DERIVED_DATA/Build/Products" -maxdepth 7 -print 2>/dev/null | tee "$DIAG_DIR/01-products.log" || true
          echo "=== TEST BUNDLE DISCOVERY ==="
          find "$DERIVED_DATA/Build/Products" -type d -name "*.xctest" -print 2>/dev/null | tee "$DIAG_DIR/01-test-bundles.log" || true
      - name: Test A — minimal schema (local)
        script: |
          set +e
          TEST_BUNDLE=$(find "$DERIVED_DATA/Build/Products" -type d -name "PetCare360Tests.xctest" -print -quit 2>/dev/null)
          if [ -z "$TEST_BUNDLE" ]; then
            echo "ABORT: PetCare360Tests.xctest not found anywhere under $DERIVED_DATA/Build/Products"
            echo "Available simulator products:"
            find "$DERIVED_DATA/Build/Products" -maxdepth 5 -print 2>/dev/null | head -200
            exit 1
          fi
          echo "Found test bundle: $TEST_BUNDLE"
          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:PetCare360Tests/PetCare360StorageDiagnosticsTests/testA_MinimalSchemaLocalCreateSaveReopen \
            -resultBundlePath "$DIAG_DIR/A.xcresult" \
            2>&1 | tee "$DIAG_DIR/A.log"
          echo "testA exit=${PIPESTATUS[0]}" >> "$DIAG_DIR/exit-codes.txt"
          true
      - name: Test B — full schema (local)
