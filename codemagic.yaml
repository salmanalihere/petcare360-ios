  petcare360-full-tests:
    name: PetCare 360 · Full Test Suite
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "PetCare360.xcodeproj"
        XCODE_SCHEME: "PetCare360"
        TEST_DIR: "build/full-tests"
        DERIVED_DATA: "build/DerivedData"
    scripts:
      - name: Toolchain + simulator inventory
        script: |
          mkdir -p "$TEST_DIR"
          {
            xcodebuild -version
            echo
            xcrun simctl list devices available
          } 2>&1 | tee "$TEST_DIR/00-toolchain.log"
      - name: Select an available iPhone simulator
        script: |
          # RUNTIME CHOICE IS LOAD-BEARING FOR STOREKIT: on the
          # iOS 26.x simulator runtime, command-line test runs are
          # reported (and were observed in this project's runs) to
          # leave the simulator's storekitd without a working
          # pushed StoreKit configuration session — products may
          # load, but Product.purchase() suspends with no
          # confirmation sheet and no error. The same suites pass
          # on the iOS 27 runtime. So: pick an iPhone on the
          # HIGHEST available iOS runtime, and print the choice —
          # the previous "first candidate" pick was arbitrary.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, re, sys
          data = json.load(sys.stdin)
          def version(runtime):
              m = re.search(r'iOS[- ](\d+)[-.](\d+)', runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          candidates = []
          for runtime, devs in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for dev in devs:
                  if dev.get('isAvailable') and 'iPhone' in dev.get('name', ''):
                      candidates.append((version(runtime), runtime, dev))
          candidates.sort(key=lambda c: c[0], reverse=True)
          # EXPLICIT RUNTIME REPORT: preferring the highest runtime
          # does NOT guarantee any particular version is installed.
          # Record every candidate, the selection, and whether
          # iOS 27+ exists on this image at all — in the artifact
          # file AND on stderr (the step log).
          lines = ['Available iPhone simulators (highest runtime first):']
          for ver, runtime, dev in candidates:
              lines.append('  - %s on %s (iOS %d.%d)' % (dev.get('name', ''), runtime, ver[0], ver[1]))
          ios27 = any(ver >= (27, 0) for ver, _, _ in candidates)
          lines.append('iOS 27 or later available on this image: %s' % ('YES' if ios27 else 'NO'))
          if candidates:
              ver, runtime, dev = candidates[0]
              print(dev['udid'])
              lines.append('SELECTED: %s on %s (iOS %d.%d), UDID %s' % (dev.get('name', ''), runtime, ver[0], ver[1], dev['udid']))
              if not ios27:
                  lines.append('NOTE: no iOS 27+ simulator exists on this image, so this run uses iOS %d.%d — the runtime range in which command-line test runs are reported to leave storekitd without a working pushed StoreKit configuration session.' % (ver[0], ver[1]))
          else:
              lines.append('SELECTED: none (no available iPhone simulator)')
          report = '\n'.join(lines) + '\n'
          sys.stderr.write(report)
          try:
              with open(os.path.join(os.environ.get('TEST_DIR', '.'), '00-simulator-selection.log'), 'w') as fh:
                  fh.write(report)
          except Exception as exc:
              sys.stderr.write('could not write simulator selection log: %s\n' % exc)
          ")
          if [ -z "$UDID" ]; then
            echo 'ERROR: no available iPhone simulator on this image' | tee "$TEST_DIR/00-toolchain.log"
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> "$CM_ENV"
          cat "$TEST_DIR/00-simulator-selection.log" 2>/dev/null || true
          xcrun simctl boot "$UDID" || true
      - name: Build for testing (simulator, ad-hoc signed, testability ON)
        script: |
          # Ad-hoc signing (CODE_SIGN_IDENTITY="-", "sign to run
          # locally") is REQUIRED for StoreKit testing: the local
          # test session binds to the app's signed identity. The
          # previous CODE_SIGNING_ALLOWED=NO build produced an
          # UNSIGNED app, and Product.purchase() fell through to
          # the real App Store, which demanded an Apple Account
          # sign-in (run 6aef9529). Signing fixed that fall-through
          # (products load, with their 7-day trial offers), but
          # purchase() then SUSPENDED with
          # no sheet at all (run 6af01f68) — the remaining variable
          # is whether the runner actually pushes the scheme's
          # StoreKit configuration into the simulator's storekitd,
          # which is runtime-dependent (see the simulator
          # selection step) and is now instrumented end-to-end:
          # app-side lifecycle logs + the xctestrun dump + the
          # post-failure storekitd evidence capture. No team or
          # account is needed for ad-hoc simulator signing.
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            ENABLE_TESTABILITY=YES \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            2>&1 | tee "$TEST_DIR/01-build-for-testing.log"
      - name: StoreKit configuration + built-app signature (diagnostics)
        script: |
          {
            echo "Scheme StoreKit configuration references:"
            grep -n "StoreKitConfigurationFileReference" "$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme" || true
            echo
            echo "Local StoreKit configuration (PetCare360/PetCare360.storekit):"
            python3 -c "
          import json
          cfg = json.load(open('PetCare360/PetCare360.storekit'))
          for group in cfg.get('subscriptionGroups', []):
              print('subscription group:', group.get('id'))
              for sub in group.get('subscriptions', []):
                  offer = sub.get('introductoryOffer') or {}
                  print(' ', sub.get('productID'), 'price', sub.get('displayPrice'),
                        'intro offer:', offer.get('paymentMode'), offer.get('subscriptionPeriod'),
                        'x', offer.get('numberOfPeriods'))
          "
            echo
            APP_PATH=$(find "$DERIVED_DATA/Build/Products" -type d -name "PetCare360.app" -print -quit 2>/dev/null)
            echo "Built app: $APP_PATH"
            echo "Built app signature (must NOT be unsigned — StoreKit's local session binds to it):"
            codesign -dvv "$APP_PATH" 2>&1 | grep -E "Identifier=|Signature=|TeamIdentifier=" || echo "(codesign reported nothing — app may be unsigned)"
            echo
            echo "Generated .xctestrun files (what test-without-building actually runs from):"
            find "$DERIVED_DATA" -name "*.xctestrun" -print 2>/dev/null | while read -r f; do
              echo "--- $f"
              plutil -p "$f" 2>/dev/null | grep -i -A2 -B2 "storekit" || echo "(no StoreKit keys in this xctestrun)"
            done
          } 2>&1 | tee "$TEST_DIR/00-storekit-config.log"
          true
      - name: Run the COMPLETE unit test suite (UI tests run isolated below)
        script: |
          set -o pipefail
          TEST_BUNDLE=$(find "$DERIVED_DATA/Build/Products" -type d -name "PetCare360Tests.xctest" -print -quit 2>/dev/null)
          if [ -z "$TEST_BUNDLE" ]; then
            echo "ABORT: PetCare360Tests.xctest not found anywhere under $DERIVED_DATA/Build/Products"
            find "$DERIVED_DATA/Build/Products" -maxdepth 5 -print 2>/dev/null | head -200
            exit 1
          fi
          echo "Found test bundle: $TEST_BUNDLE"
          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$TEST_DIR/FullSuite.xcresult" \
            -skip-testing:PetCare360UITests \
            -skip-testing:PetCare360Tests/PetCare360StoreKitDiagnosticsTests/testSKTestSessionLocalPurchaseCompletes \
            2>&1 | tee "$TEST_DIR/02-full-tests.log"
      - name: Run GATE UI tests on a FRESH app install (CI-supported — no purchase required; GATING)
        script: |
          # Gate-only UI tests (class PetCare360GateUITests,
          # added 2026-11-10 under the approved Build 20 testing
          # strategy): everything the mandatory subscription gate
          # shows and does BEFORE any purchase — product loading,
          # prices, trial information, plan selection, purchase-
          # button state, legal links, and visible enforcement.
          # The class's seventh test (restore with no purchases)
          # is EXCLUDED from this gating group: it performs a
          # live AppStore.sync(), whose behaviour on an account-
          # less simulator is environment-dependent, so it runs
          # in its own step below and is reported independently.
          # No purchase is attempted and no
          # entitlement is faked, so these tests run reliably in
          # CI and ARE part of the build gate: a failure here
          # fails the build.
          # UI test methods relaunch the same install, so each
          # test still gets a fresh install (uninstall first),
          # exactly like the journey tests below. Discovery is
          # per class from the source, so a newly added gate test
          # is picked up automatically.
          mkdir -p "$TEST_DIR/ui"
          GATE_METHODS=$(sed -n '/final class PetCare360GateUITests/,$p' PetCare360UITests/PetCare360UITests.swift | grep -oE 'func test[A-Za-z0-9_]*' | sed 's/^func //' | grep -v '^testGateRestoreWithNoPurchasesReportsOutcome$' | sort -u)
          if [ -z "$GATE_METHODS" ]; then
            echo "ABORT: no gate UI test methods discovered in PetCare360GateUITests"
            exit 1
          fi
          echo "Discovered GATING gate UI tests (restore test excluded — it runs separately):"
          echo "$GATE_METHODS"
          FAILED=0
          for METHOD in $GATE_METHODS; do
            echo "================ GATE UI TEST: $METHOD (fresh install) ================"
            xcrun simctl uninstall "$SIM_UDID" com.xenon-media.petcare360 >/dev/null 2>&1 || true
            set -o pipefail
            if ! xcodebuild test-without-building \
              -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
              -destination "platform=iOS Simulator,id=$SIM_UDID" \
              -derivedDataPath "$DERIVED_DATA" \
              -resultBundlePath "$TEST_DIR/ui/gate-$METHOD.xcresult" \
              -only-testing:"PetCare360UITests/PetCare360GateUITests/$METHOD" \
              2>&1 | tee "$TEST_DIR/ui/gate-$METHOD.log"; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more GATE UI tests failed — see $TEST_DIR/ui/gate-*.log"
            exit 1
          fi
          echo "All gate UI tests passed."
      - name: Run RESTORE gate UI test separately (environment-dependent — reported independently, NOT gating)
        script: |
          # testGateRestoreWithNoPurchasesReportsOutcome is kept
          # OUT of the gating gate group on purpose: what a live
          # AppStore.sync() does on a simulator with no signed-in
          # account is an environment property, not an app
          # property — iOS can park it behind an Apple Account
          # authentication prompt or never return at all. The
          # test itself separates the outcomes:
          #   definite no-purchase / restore-error message -> PASS
          #   app unlocks, or success text behind a still-locked
          #     gate -> FAIL (access without a purchase, or an
          #     inconsistent outcome)
          #   authentication prompt or 45s hang -> XCTSkip with
          #     an ENVIRONMENT LIMITATION reason in the log.
          # This step runs it alone on a fresh install, classifies
          # the result FROM THE LOG, and reports it in
          # ui/RESTORE-RESULT.txt and the summary — independently
          # of the gate group, never gating this build.
          mkdir -p "$TEST_DIR/ui"
          METHOD=testGateRestoreWithNoPurchasesReportsOutcome
          LOG="$TEST_DIR/ui/gate-restore-$METHOD.log"
          RESULT_FILE="$TEST_DIR/ui/RESTORE-RESULT.txt"
          echo "RESTORE GATE UI TEST — environment-dependent; reported independently; not gating this build." > "$RESULT_FILE"
          echo "================ RESTORE GATE UI TEST: $METHOD (fresh install) ================"
          xcrun simctl uninstall "$SIM_UDID" com.xenon-media.petcare360 >/dev/null 2>&1 || true
          set -o pipefail
          # ERREXIT SAFETY: with pipefail on, a failed xcodebuild
          # makes this pipeline return non-zero, and under set -e
          # the script would exit HERE — before PIPESTATUS is
          # captured and before any classification is written.
          # Save the current errexit state, disable it for the
          # pipeline only, capture PIPESTATUS[0] immediately,
          # then restore the saved state. The captured STATUS is
          # used exactly as before (0 is required for PASS; a
          # failure is classified, never converted into a pass).
          case $- in *e*) ERREXIT_WAS_ON=1 ;; *) ERREXIT_WAS_ON=0 ;; esac
          set +e
          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$TEST_DIR/ui/gate-restore-$METHOD.xcresult" \
            -only-testing:"PetCare360UITests/PetCare360GateUITests/$METHOD" \
            2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          if [ "$ERREXIT_WAS_ON" -eq 1 ]; then set -e; fi
          if grep -q "ENVIRONMENT LIMITATION" "$LOG"; then
            echo "ENVIRONMENT-LIMITED: $METHOD — StoreKit presented an authentication prompt or the sync never returned in this environment, so the no-purchase restore outcome could not be exercised here. See ui/gate-restore-$METHOD.log" >> "$RESULT_FILE"
          elif grep -q "UNLOCKED during restore" "$LOG"; then
            echo "FAIL: $METHOD — the app unlocked during restore on a fresh install with no purchase. INVESTIGATE. See ui/gate-restore-$METHOD.log" >> "$RESULT_FILE"
          elif [ "$STATUS" -eq 0 ]; then
            echo "PASS: $METHOD — the app reported a definite no-purchase / restore-error outcome." >> "$RESULT_FILE"
          else
            echo "FAIL: $METHOD — see ui/gate-restore-$METHOD.log" >> "$RESULT_FILE"
          fi
          cat "$RESULT_FILE"
          true
      - name: Run FULL JOURNEY UI tests on a FRESH app install (purchase-dependent — each failure classified from its log; reported separately, NOT gating)
        script: |
          # Full journey UI tests (class PetCare360UITests, the
          # original eight): every journey sits behind the
          # mandatory subscription gate, so each test must first
          # complete a REAL StoreKit purchase through the gate.
          # On this Codemagic image that purchase cannot complete
          # for a command-line-installed app — storekitd refuses
          # the local StoreKit session ("not installed for
          # development"; Builds 18 and 20 investigations) and the
          # purchase falls through to the real store, which has
          # no signed-in account (accountMissing). This is a
          # proven environment limitation, not an app defect.
          #
          # SEPARATION IS EXPLICIT, per the approved strategy:
          # these tests still RUN on every build, each on a fresh
          # install, and every result is reported per test in
          # ui/JOURNEY-RESULTS.txt and in the summary under its
          # own heading — but they do not fail this build on this
          # image. On an environment where a purchase can
          # complete (Xcode IDE install, physical device) the
          # same tests are the purchase gate. Nothing here is
          # skipped, stubbed, or hidden: a journey PASS on this
          # image would mean the environment changed and must be
          # investigated, not celebrated silently.
          mkdir -p "$TEST_DIR/ui"
          JOURNEY_METHODS=$(sed -n '/final class PetCare360UITests:/,/final class PetCare360GateUITests/p' PetCare360UITests/PetCare360UITests.swift | grep -oE 'func test[A-Za-z0-9_]*' | sed 's/^func //' | sort -u)
          if [ -z "$JOURNEY_METHODS" ]; then
            echo "ABORT: no journey UI test methods discovered in PetCare360UITests"
            exit 1
          fi
          echo "Discovered full journey UI tests:"
          echo "$JOURNEY_METHODS"
          RESULTS="$TEST_DIR/ui/JOURNEY-RESULTS.txt"
          echo "FULL JOURNEY UI TESTS — purchase-dependent. Each result is classified from its own log: ENVIRONMENT-BLOCKED only when the purchase attempt was reached and hit the known StoreKit session/account failure; UNEXPECTED FAILURE otherwise; UNEXPECTED PASS if one completes on this image. Reported separately; not gating this build." > "$RESULTS"
          FAILED=0
          for METHOD in $JOURNEY_METHODS; do
            echo "================ JOURNEY UI TEST: $METHOD (fresh install) ================"
            xcrun simctl uninstall "$SIM_UDID" com.xenon-media.petcare360 >/dev/null 2>&1 || true
            set -o pipefail
            # ERREXIT SAFETY (same pattern as the restore step):
            # with pipefail on, a failed xcodebuild makes this
            # pipeline return non-zero, and under set -e the
            # script would exit mid-loop — before PIPESTATUS is
            # captured and before this journey is classified.
            # Save errexit, disable it for the pipeline only,
            # capture PIPESTATUS[0] immediately, restore. The
            # classification below is unchanged: STATUS 0 is
            # required for the pass branch, and a failure is
            # classified from the log, never converted to a pass.
            case $- in *e*) ERREXIT_WAS_ON=1 ;; *) ERREXIT_WAS_ON=0 ;; esac
            set +e
            xcodebuild test-without-building \
              -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
              -destination "platform=iOS Simulator,id=$SIM_UDID" \
              -derivedDataPath "$DERIVED_DATA" \
              -resultBundlePath "$TEST_DIR/ui/journey-$METHOD.xcresult" \
              -only-testing:"PetCare360UITests/PetCare360UITests/$METHOD" \
              2>&1 | tee "$TEST_DIR/ui/journey-$METHOD.log"
            STATUS=${PIPESTATUS[0]}
            if [ "$ERREXIT_WAS_ON" -eq 1 ]; then set -e; fi
            LOG="$TEST_DIR/ui/journey-$METHOD.log"
            # CLASSIFY FROM THE ACTUAL LOG. A journey failure is
            # ENVIRONMENT-BLOCKED only when the log shows the test
            # reached the purchase attempt and then hit the known
            # StoreKit purchase/session/account failure — proven
            # by one of attemptGatePurchase's three terminal
            # messages, all of which occur only after the purchase
            # tap. A failure anywhere else (setup, onboarding,
            # storage, an unrelated assertion) is an UNEXPECTED
            # FAILURE and must be investigated, never waved
            # through as environment. Full logs are preserved.
            if [ "$STATUS" -eq 0 ]; then
              echo "UNEXPECTED PASS: $METHOD — completed on this CI image; the purchase environment may have changed, investigate before trusting it." >> "$RESULTS"
              echo "JOURNEY RESULT: $METHOD — UNEXPECTED PASS (classification in ui/JOURNEY-RESULTS.txt)"
            elif grep -qE "The purchase did not complete within 30s|PURCHASE REACHED THE REAL APP STORE|The purchase attempt finished WITHOUT unlocking" "$LOG"; then
              echo "ENVIRONMENT-BLOCKED: $METHOD — reached the purchase attempt, then hit the known StoreKit session/account failure. See ui/journey-$METHOD.log" >> "$RESULTS"
              echo "JOURNEY RESULT: $METHOD — ENVIRONMENT-BLOCKED (purchase attempt reached; known StoreKit failure)"
              FAILED=1
            else
              echo "UNEXPECTED FAILURE: $METHOD — failed BEFORE the purchase attempt or for an unrelated reason; INVESTIGATE. See ui/journey-$METHOD.log" >> "$RESULTS"
              echo "JOURNEY RESULT: $METHOD — UNEXPECTED FAILURE (not the known StoreKit failure; investigate)"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            # EVIDENCE CAPTURE (best effort, never fatal) — FIXED
            # after run 6af02598, whose capture lost the evidence
            # it existed to keep: the old single predicate matched
            # EVERY storekitd subsystem (401 of 409 lines were the
            # daemon's push-connection spam) and `tail -400` then
            # kept only the final ~40 seconds, discarding
            # purchase.begin and the first heartbeat; and the old
            # container probe ran `ls` INSIDE the simulator via
            # simctl spawn, which errored at the simctl level
            # (iOS ships no such probe binary) and listed nothing.
            # Now: (1) the app's own log is captured SEPARATELY
            # and UNCUT (it is sparse — a handful of lifecycle
            # lines per launch, so nothing needs trimming);
            # (2) storekitd is filtered to its StoreKit
            # subsystems only, excluding the push-connection
            # noise, with a generous cap; (3) the container probe
            # runs on the HOST against the simulator's data
            # directory, where a directory listing can actually
            # be produced, and reports present-or-absent
            # explicitly for each probed path.
            {
              echo "=== App log (subsystem com.xenon-media.petcare360, last 30m, UNCUT) ==="
              xcrun simctl spawn "$SIM_UDID" log show --last 30m --style compact \
                --predicate 'subsystem == "com.xenon-media.petcare360"' 2>&1
              echo
              echo "=== storekitd log (StoreKit subsystems only, last 30m) ==="
              xcrun simctl spawn "$SIM_UDID" log show --last 30m --style compact \
                --predicate 'process == "storekitd" AND subsystem BEGINSWITH "com.apple.storekit"' 2>&1 | tail -2000
              echo
              echo "=== storekitd container probe (host-side) ==="
              DEV_DATA="$HOME/Library/Developer/CoreSimulator/Devices/$SIM_UDID/data"
              echo "Simulator data directory: $DEV_DATA"
              for PROBE in "$DEV_DATA/tmp/com.apple.storekit" "$DEV_DATA/Library/com.apple.storekit" "$DEV_DATA/private/var/tmp/com.apple.storekit"; do
                if [ -e "$PROBE" ]; then
                  echo "PROBE PRESENT: $PROBE"
                  ls -la "$PROBE" 2>&1
                else
                  echo "PROBE ABSENT: $PROBE (no such path on the host)"
                fi
              done
              echo "StoreKit-named paths under the device data directory (maxdepth 5):"
              find "$DEV_DATA" -maxdepth 5 -iname "*storekit*" -print 2>/dev/null || true
            } 2>&1 | tee "$TEST_DIR/ui/storekit-evidence.log" || true
          fi
          echo "Journey step finished. Per-test results, each classified individually from its own log: ui/JOURNEY-RESULTS.txt (reported separately; NOT gating the build)."
          true
      - name: Summary — executed counts from the real log
        script: |
          {
            echo '================ FULL TEST SUMMARY ================'
            grep -E "Test Suite '.*' (passed|failed)" "$TEST_DIR/02-full-tests.log" "$TEST_DIR"/ui/*.log 2>/dev/null || echo '(no suite lines — see log)'
            grep -E "Executed [0-9]+ tests" "$TEST_DIR/02-full-tests.log" "$TEST_DIR"/ui/*.log 2>/dev/null | tail -12 || true
            grep -E "Test Case .* failed" "$TEST_DIR/02-full-tests.log" "$TEST_DIR"/ui/*.log 2>/dev/null || echo '(no failed test-case lines)'
            echo '---------------- UI SPLIT (approved Build 20 strategy) ----------------'
            echo 'Gate UI tests (CI-supported, GATING): results in ui/gate-*.log'
            echo 'Restore gate UI test (environment-dependent; reported independently, not gating):'
            cat "$TEST_DIR/ui/RESTORE-RESULT.txt" 2>/dev/null || echo '(no restore results file — restore step did not run)'
            echo 'Full journey UI tests (purchase-dependent; classified per log; reported, not gating):'
            cat "$TEST_DIR/ui/JOURNEY-RESULTS.txt" 2>/dev/null || echo '(no journey results file — journey step did not run)'
          } | tee "$TEST_DIR/99-summary.log"
          true
    artifacts:
      - build/full-tests/*.log
      - build/full-tests/*.xcresult
      - build/full-tests/ui/*.log
      - build/full-tests/ui/*.xcresult

  petcare360-storekit-diagnostics:
    name: PetCare 360 · StoreKit Diagnostics (isolated)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "PetCare360.xcodeproj"
        XCODE_SCHEME: "PetCare360"
        TEST_DIR: "build/storekit-diag"
        DIAG_DIR: "build/storekit-diag"
        DERIVED_DATA: "build/storekit-diag/DerivedData"
    scripts:
      - name: Toolchain + simulator inventory
        script: |
          mkdir -p "$DIAG_DIR"
          {
            xcodebuild -version
            echo
            xcrun simctl list devices available
          } 2>&1 | tee "$DIAG_DIR/00-toolchain.log"
      - name: Select an available iPhone simulator (highest runtime, explicit report)
        script: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, re, sys
          data = json.load(sys.stdin)
          def version(runtime):
              m = re.search(r'iOS[- ](\d+)[-.](\d+)', runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          candidates = []
          for runtime, devs in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for dev in devs:
                  if dev.get('isAvailable') and 'iPhone' in dev.get('name', ''):
                      candidates.append((version(runtime), runtime, dev))
          candidates.sort(key=lambda c: c[0], reverse=True)
          lines = ['Available iPhone simulators (highest runtime first):']
          for ver, runtime, dev in candidates:
              lines.append('  - %s on %s (iOS %d.%d)' % (dev.get('name', ''), runtime, ver[0], ver[1]))
          ios27 = any(ver >= (27, 0) for ver, _, _ in candidates)
          lines.append('iOS 27 or later available on this image: %s' % ('YES' if ios27 else 'NO'))
          if candidates:
              ver, runtime, dev = candidates[0]
              print(dev['udid'])
              lines.append('SELECTED: %s on %s (iOS %d.%d), UDID %s' % (dev.get('name', ''), runtime, ver[0], ver[1], dev['udid']))
          report = '\n'.join(lines) + '\n'
          sys.stderr.write(report)
          try:
              with open(os.path.join(os.environ.get('TEST_DIR', '.'), '00-simulator-selection.log'), 'w') as fh:
                  fh.write(report)
          except Exception:
              pass
          ")
          if [ -z "$UDID" ]; then
            echo 'ERROR: no available iPhone simulator on this image'
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> "$CM_ENV"
          cat "$DIAG_DIR/00-simulator-selection.log" 2>/dev/null || true
          xcrun simctl boot "$UDID" || true
      - name: Build for testing (SPLIT pipeline — the configuration under comparison)
        script: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            ENABLE_TESTABILITY=YES \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            2>&1 | tee "$DIAG_DIR/01-build-for-testing.log"
      - name: Capture the SPLIT .xctestrun (from build-for-testing)
        script: |
          mkdir -p "$DIAG_DIR/split"
          find "$DERIVED_DATA/Build/Products" -name "*.xctestrun" | while read -r f; do
            base=$(basename "$f")
            cp -R "$f" "$DIAG_DIR/split/$base"
            plutil -p "$f" > "$DIAG_DIR/split/$base.plist.txt" 2>&1 || true
          done
          KEYS=$(grep -ci "storekit" "$DIAG_DIR"/split/*.plist.txt 2>/dev/null | awk -F: '{n+=$NF} END {print n+0}')
          echo "SPLIT (build-for-testing): StoreKit key lines across .xctestrun dumps: $KEYS" | tee "$DIAG_DIR/split-verdict.log"
          true
      - name: Run the SKTestSession diagnostic via a SINGLE xcodebuild test invocation
        script: |
          # ONE invocation that builds AND tests — the contrast
          # with the split pipeline. It runs ONLY the isolated
          # diagnostic (PetCare360StoreKitDiagnosticsTests), which
          # creates an SKTestSession from the PetCare360.storekit
          # bundled in the unit-test target, loads both products,
          # buys the monthly plan programmatically (dialogs
          # disabled — no sheet), and asserts a verified current
          # entitlement. Its SKDIAG lines are the verdict trail.
          xcrun simctl uninstall "$SIM_UDID" com.xenon-media.petcare360 >/dev/null 2>&1 || true
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$DIAG_DIR/SingleRun.xcresult" \
            -only-testing:PetCare360Tests/PetCare360StoreKitDiagnosticsTests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            ENABLE_TESTABILITY=YES \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            2>&1 | tee "$DIAG_DIR/02-single-test.log" || echo "xcodebuild test exited non-zero — the summary step reports the verdict"
          true
      - name: Capture the SINGLE-invocation .xctestrun (regenerated by xcodebuild test)
        script: |
          mkdir -p "$DIAG_DIR/single"
          find "$DERIVED_DATA/Build/Products" -name "*.xctestrun" | while read -r f; do
            base=$(basename "$f")
            cp -R "$f" "$DIAG_DIR/single/$base"
            plutil -p "$f" > "$DIAG_DIR/single/$base.plist.txt" 2>&1 || true
          done
          KEYS=$(grep -ci "storekit" "$DIAG_DIR"/single/*.plist.txt 2>/dev/null | awk -F: '{n+=$NF} END {print n+0}')
          echo "SINGLE (xcodebuild test): StoreKit key lines across .xctestrun dumps: $KEYS" | tee "$DIAG_DIR/single-verdict.log"
          true
      - name: StoreKit evidence (app log uncut + filtered storekitd + host-side probe)
        script: |
          {
            echo "=== App log (subsystem com.xenon-media.petcare360, last 30m, UNCUT) ==="
            xcrun simctl spawn "$SIM_UDID" log show --last 30m --style compact \
              --predicate 'subsystem == "com.xenon-media.petcare360"' 2>&1
            echo
            echo "=== storekitd log (StoreKit subsystems only, last 30m) ==="
            xcrun simctl spawn "$SIM_UDID" log show --last 30m --style compact \
              --predicate 'process == "storekitd" AND subsystem BEGINSWITH "com.apple.storekit"' 2>&1 | tail -2000
            echo
            echo "=== storekitd container probe (host-side) ==="
            DEV_DATA="$HOME/Library/Developer/CoreSimulator/Devices/$SIM_UDID/data"
            echo "Simulator data directory: $DEV_DATA"
            for PROBE in "$DEV_DATA/tmp/com.apple.storekit" "$DEV_DATA/Library/com.apple.storekit" "$DEV_DATA/private/var/tmp/com.apple.storekit"; do
              if [ -e "$PROBE" ]; then
                echo "PROBE PRESENT: $PROBE"
                ls -la "$PROBE" 2>&1
              else
                echo "PROBE ABSENT: $PROBE (no such path on the host)"
              fi
            done
            echo "StoreKit-named paths under the device data directory (maxdepth 5):"
            find "$DEV_DATA" -maxdepth 5 -iname "*storekit*" -print 2>/dev/null || true
          } 2>&1 | tee "$DIAG_DIR/03-storekit-evidence.log"
          true
      - name: Comparison + verdict summary
        script: |
          {
            echo '================ STOREKIT DIAGNOSTIC SUMMARY ================'
            cat "$DIAG_DIR/split-verdict.log" 2>/dev/null || echo 'SPLIT verdict missing'
            cat "$DIAG_DIR/single-verdict.log" 2>/dev/null || echo 'SINGLE verdict missing'
            echo
            echo '--- SKDIAG lines from the single-invocation run ---'
            grep -E "SKDIAG" "$DIAG_DIR/02-single-test.log" 2>/dev/null || echo '(no SKDIAG lines — the diagnostic did not run; see 02-single-test.log)'
            echo
            grep -E "Test Case .* (passed|failed)" "$DIAG_DIR/02-single-test.log" 2>/dev/null || true
          } | tee "$DIAG_DIR/99-summary.log"
          if grep -q "SKDIAG VERDICT: local StoreKit purchase COMPLETES" "$DIAG_DIR/02-single-test.log"; then
            echo 'DIAGNOSTIC RESULT: a local StoreKit purchase COMPLETES in this environment'
          else
            echo 'DIAGNOSTIC RESULT: a local StoreKit purchase does NOT complete in this environment — see the SKDIAG failure line for the exact step and error'
            exit 1
          fi
    artifacts:
      - build/storekit-diag/*.log
      - build/storekit-diag/*.xcresult
      - build/storekit-diag/**/*.plist.txt
